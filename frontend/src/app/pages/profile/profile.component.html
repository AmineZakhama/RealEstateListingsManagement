<div class="bg-gray-50 min-h-screen py-12">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">Edit Profile</h2>
      
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
          <input type="text" [(ngModel)]="formData.name" name="name" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500" required>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
          <input type="tel" [(ngModel)]="formData.phone" name="phone" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Contact Email</label>
          <input type="email" [(ngModel)]="formData.contactEmail" name="contactEmail" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Facebook Link</label>
          <input type="url" [(ngModel)]="formData.facebookLink" name="facebookLink" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        
        <button type="submit" [disabled]="isLoading" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-all">
          {{ isLoading ? 'Saving...' : 'Save Profile' }}
        </button>
      </form>
    </div>
  </div>
</div>
