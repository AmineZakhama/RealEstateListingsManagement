<div class="bg-gray-50 min-h-screen py-12">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-8">My Messages</h1>
    
    <div *ngIf="isLoading" class="flex justify-center py-10">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
    </div>
    
    <div *ngIf="!isLoading && messages.length === 0" class="bg-white p-10 rounded-3xl text-center border border-gray-100">
      <p class="text-gray-500">You have no messages yet.</p>
    </div>

    <div *ngIf="!isLoading && messages.length > 0" class="space-y-4">
      <div *ngFor="let msg of messages" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex justify-between items-start mb-4">
          <div>
            <h3 class="font-bold text-gray-900 text-lg">{{ msg.senderName }}</h3>
            <div class="text-sm text-gray-500 flex gap-4 mt-1">
              <a [href]="'mailto:' + msg.senderEmail" class="hover:text-indigo-600 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                {{ msg.senderEmail }}
              </a>
              <a [href]="'tel:' + msg.senderPhone" class="hover:text-indigo-600 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
                {{ msg.senderPhone }}
              </a>
            </div>
          </div>
          <span class="text-xs text-gray-400">{{ msg.createdAt | date:'medium' }}</span>
        </div>
        
        <div class="bg-gray-50 p-4 rounded-xl text-gray-700 border border-gray-100">
          {{ msg.message }}
        </div>
        
        <div class="mt-4 text-sm">
          <span class="text-gray-500">Regarding:</span>
          <a [routerLink]="['/listings', msg.listing?._id]" class="ml-2 font-medium text-indigo-600 hover:text-indigo-800">
            {{ msg.listing?.title || 'Deleted Announce' }}
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
