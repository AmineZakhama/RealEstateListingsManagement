<nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 shadow-sm border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-20">
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white font-bold text-xl shadow-lg">
            R
          </div>
          <span class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-600">RealEstates</span>
        </a>
      </div>
      
      <div class="hidden md:flex items-center space-x-8">
        <a routerLink="/listings" class="text-gray-600 hover:text-indigo-600 font-medium transition-colors">Browse Announces</a>
      </div>

      <div class="hidden md:flex items-center space-x-4">
        <!-- If logged out -->
        <ng-container *ngIf="!currentUser">
          <a routerLink="/login" class="text-gray-600 hover:text-indigo-600 font-medium transition-colors">Log in</a>
          <a routerLink="/register" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-full font-medium transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
            Sign up
          </a>
        </ng-container>

        <!-- If logged in -->
        <ng-container *ngIf="currentUser">
          <a routerLink="/listings/new" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-full font-medium transition-colors hover:bg-indigo-100">
            Add Announce
          </a>

          <!-- Profile Dropdown -->
          <div class="relative dropdown-container">
            <button (click)="toggleDropdown()" 
                    class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors focus:outline-none">
              <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-700 font-bold uppercase">
                {{ currentUser.name.charAt(0) }}
              </div>
              <span class="text-gray-700 font-medium hidden sm:inline">{{ (currentUser.name || '').split(' ')[0] }}</span>
              <svg [class.rotate-180]="isDropdownOpen" class="w-4 h-4 text-gray-600 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div *ngIf="isDropdownOpen" 
                 class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border border-gray-100 py-2 z-50 dropdown-menu"
                 (mouseleave)="closeDropdown()">
              <div class="px-4 py-3 border-b border-gray-100">
                <p class="text-sm text-gray-500">Signed in as</p>
                <p class="text-gray-900 font-semibold truncate">{{ currentUser.email }}</p>
              </div>

              <a (click)="closeDropdown()" routerLink="/profile" 
                 class="block w-full text-left px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                My Profile
              </a>

              <a (click)="closeDropdown()" routerLink="/dashboard" 
                 class="block w-full text-left px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-3m0 0l7-4 7 4M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9m-9 16l4-4m0 0l4 4m-4-4V5"></path>
                </svg>
                My Dashboard
              </a>

              <a (click)="closeDropdown()" routerLink="/favorites" 
                 class="block w-full text-left px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                My Favorites
              </a>

              <a (click)="closeDropdown()" routerLink="/messages" 
                 class="block w-full text-left px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                Messages
              </a>

              <div class="border-t border-gray-100 my-2"></div>

              <button (click)="logout()" 
                      class="block w-full text-left px-4 py-2 text-red-600 hover:bg-red-50 transition-colors flex items-center gap-2 font-medium">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                Logout
              </button>
            </div>
          </div>
        </ng-container>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden flex items-center">
        <button (click)="toggleMobileMenu()" class="text-gray-600 hover:text-indigo-600 focus:outline-none p-2 rounded-md hover:bg-gray-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" *ngIf="!isMobileMenuOpen">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" *ngIf="isMobileMenuOpen">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Panel -->
  <div class="md:hidden bg-white border-t border-gray-100 shadow-xl" *ngIf="isMobileMenuOpen">
    <div class="px-4 py-3 space-y-2">
      <a routerLink="/listings" (click)="toggleMobileMenu()" class="block px-3 py-2 rounded-xl text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-indigo-50">Browse Announces</a>
      
      <ng-container *ngIf="!currentUser">
        <a routerLink="/login" (click)="toggleMobileMenu()" class="block px-3 py-2 rounded-xl text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-indigo-50">Log in</a>
        <a routerLink="/register" (click)="toggleMobileMenu()" class="block px-3 py-2 rounded-xl text-base font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 mt-2 text-center">Sign up</a>
      </ng-container>

      <ng-container *ngIf="currentUser">
        <div class="border-t border-gray-100 my-2 pt-2">
          <p class="px-3 text-xs text-gray-500 uppercase tracking-wider">Signed in as</p>
          <p class="px-3 text-sm font-semibold text-gray-900 mb-2 truncate">{{ currentUser.email }}</p>
        </div>
        
        <a routerLink="/listings/new" (click)="toggleMobileMenu()" class="block px-3 py-2 rounded-xl text-base font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 mb-2">Add Announce</a>
        <a routerLink="/dashboard" (click)="toggleMobileMenu()" class="block px-3 py-2 rounded-xl text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-indigo-50">My Dashboard</a>
        <a routerLink="/favorites" (click)="toggleMobileMenu()" class="block px-3 py-2 rounded-xl text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-indigo-50">Favorites</a>
        <a routerLink="/messages" (click)="toggleMobileMenu()" class="block px-3 py-2 rounded-xl text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-indigo-50">Messages</a>
        <a routerLink="/profile" (click)="toggleMobileMenu()" class="block px-3 py-2 rounded-xl text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-indigo-50">Profile</a>
        
        <button (click)="logout(); toggleMobileMenu()" class="w-full text-left block px-3 py-2 rounded-xl text-base font-medium text-red-600 hover:bg-red-50 mt-2">Logout</button>
      </ng-container>
    </div>
  </div>
</nav>
